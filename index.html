
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EYTA ASANSÖR - Son Kontrol Formu</title>

<style>
:root {
  --blue: #173b63;
  --line: #d6dee8;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #eef2f7;
  color: #172334;
  font: 14px Arial, sans-serif;
}

main {
  max-width: 1000px;
  margin: auto;
  padding: 24px;
  background: white;
  border-radius: 12px;
}

header {
  text-align: center;
  border-bottom: 2px solid var(--blue);
  padding-bottom: 14px;
}

header h1 {
  color: var(--blue);
  font-size: 28px;
  margin: 8px 0;
}

header h2 {
  color: #26384c;
  font-size: 19px;
  margin: 8px 0;
}

.section-title {
  background: #edf3f9;
  color: var(--blue);
  padding: 10px;
  font-size: 16px;
  margin: 24px 0 14px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.field { min-width: 0; }

label {
  display: block;
  font-weight: bold;
  margin-bottom: 5px;
}

input, select {
  width: 100%;
  min-width: 0;
  padding: 10px;
  border: 1px solid #bcc9d8;
  border-radius: 5px;
  font: inherit;
  background: white;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 24px;
}

button {
  padding: 12px 16px;
  border: 0;
  border-radius: 6px;
  background: var(--blue);
  color: white;
  font-size: 14px;
  cursor: pointer;
}

button.secondary {
  background: #e7edf4;
  color: var(--blue);
}

#status {
  margin-top: 14px;
  color: #315b43;
  overflow-wrap: anywhere;
}

.small {
  color: #536276;
  font-size: 12px;
  line-height: 1.5;
}

@media (max-width: 600px) {
  body { padding: 0; }

  main {
    padding: 14px;
    border-radius: 0;
  }

  .grid { grid-template-columns: 1fr; }

  header h1 { font-size: 23px; }

  .actions button { flex: 1 1 100%; }
}

@media print {
  @page {
    size: A4;
    margin: 12mm;
  }

  body {
    padding: 0;
    background: white;
    font-size: 10pt;
  }

  main {
    max-width: none;
    padding: 0;
    border-radius: 0;
  }

  .actions, #status, .small {
    display: none !important;
  }

  .grid { gap: 12px; }

  input, select {
    color: black;
    border: 0;
    border-bottom: 1px solid #aaa;
    border-radius: 0;
    padding: 5px 2px;
    appearance: none;
    font-size: 10pt;
  }

  .section-title {
    break-after: avoid;
  }

  .field {
    break-inside: avoid;
  }
}
</style>
</head>

<body>
<main>

<header>
  <h1>EYTA ASANSÖR</h1>
  <h2>ASANSÖR SON KONTROL FORMU</h2>
</header>

<form id="form">

  <div class="section-title">1. ASANSÖR SİSTEMİ</div>

  <div class="grid">
    <div class="field">
      <label>Asansör tahrik tipi</label>
      <select name="tahrik" required>
        <option value="">Seçiniz</option>
        <option value="Elektrikli">Elektrikli</option>
        <option value="Hidrolik">Hidrolik</option>
      </select>
    </div>
  </div>

  <div class="section-title">2. ŞANTİYE VE PROJE BİLGİLERİ</div>

  <div class="grid">

    <div class="field">
      <label>Şantiye adresi</label>
      <input name="adres">
    </div>

    <div class="field">
      <label>Asansör seri numarası</label>
      <input name="asansorNo">
    </div>

    <div class="field">
      <label>Montör ismi</label>
      <input name="montor">
    </div>

    <div class="field">
      <label>Uygulanan standart</label>
      <input name="standart" placeholder="Örn. EN 81-20">
    </div>

    <div class="field">
      <label>Yardımcı montör</label>
      <input name="yardimci">
    </div>

    <div class="field">
      <label>Bitiş tarihi</label>
      <input type="date" name="bitis">
    </div>

    <div class="field">
      <label>Başlangıç tarihi</label>
      <input type="date" name="baslangic">
    </div>

  </div>

  <div class="actions">
    <button type="button" id="saveBtn">Bilgileri kaydet</button>
    <button type="button" id="pdfBtn">PDF oluştur / yazdır</button>
    <button type="button" id="exportBtn">Verileri dosyaya kaydet</button>
    <button type="button" class="secondary" id="importBtn">
      Kayıtlı dosyayı yükle
    </button>
    <input
      type="file"
      id="importFile"
      accept=".json,application/json"
      hidden
    >
    <button type="button" class="secondary" id="clearBtn">
      Formu temizle
    </button>
  </div>

  <p id="status" role="status" aria-live="polite"></p>

  <p class="small">
    Bilgileri kaydet seçeneği bu tarayıcıda kayıt tutar.
    Başka cihaza aktarmak için “Verileri dosyaya kaydet”
    seçeneğini kullanın. PDF için yazdırma penceresinde
    “PDF olarak kaydet” seçeneğini seçin.
  </p>

</form>
</main>

<script>
const form = document.getElementById("form");
const statusText = document.getElementById("status");
const storageKey = "eytaAsansorFormV1";

function showStatus(message) {
  statusText.textContent = message;
}

function getFormData() {
  return Object.fromEntries(new FormData(form).entries());
}

function fillForm(data) {
  for (const [name, value] of Object.entries(data)) {
    const field = form.elements.namedItem(name);

    if (field && typeof value === "string") {
      field.value = value;
    }
  }
}

function saveLocal() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(getFormData()));
    showStatus("Bilgiler bu tarayıcıya kaydedildi.");
    return true;
  } catch (error) {
    showStatus(
      "Tarayıcıya kaydedilemedi. Verileri dosyaya kaydet seçeneğini kullanın."
    );
    return false;
  }
}

// Form açıldığında aynı tarayıcıdaki kayıtları yükle.
try {
  const saved = localStorage.getItem(storageKey);

  if (saved) {
    fillForm(JSON.parse(saved));
    showStatus("Önceki kayıt yüklendi.");
  }
} catch (error) {
  showStatus("Önceki kayıt okunamadı.");
}

// Değişiklikleri otomatik kaydetmeyi dene.
form.addEventListener("input", () => {
  try {
    localStorage.setItem(storageKey, JSON.stringify(getFormData()));
  } catch (error) {
    // Kullanıcı isterse ayrıca dosyaya kaydedebilir.
  }
});

form.addEventListener("change", () => {
  try {
    localStorage.setItem(storageKey, JSON.stringify(getFormData()));
  } catch (error) {
    // Kullanıcı isterse ayrıca dosyaya kaydedebilir.
  }
});

document.getElementById("saveBtn").addEventListener("click", saveLocal);

// PDF oluşturma / yazdırma
document.getElementById("pdfBtn").addEventListener("click", () => {
  window.print();
});

// Form bilgilerini başka cihaza taşımak için JSON dosyası indir.
document.getElementById("exportBtn").addEventListener("click", () => {
  const data = getFormData();
  const blob = new Blob(
    [JSON.stringify(data, null, 2)],
    { type: "application/json;charset=utf-8" }
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "eyta-asansor-kayit.json";
  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(url), 1000);

  showStatus("Veri dosyası indirildi. Diğer cihaza gönderebilirsiniz.");
});

// Başka cihazdan gelen JSON dosyasını yükle.
document.getElementById("importBtn").addEventListener("click", () => {
  document.getElementById("importFile").click();
});

document.getElementById("importFile").addEventListener("change", async (event) => {
  const file = event.target.files[0];

  if (!file) return;

  try {
    const data = JSON.parse(await file.text());

    if (
      !data ||
      typeof data !== "object" ||
      Array.isArray(data) ||
      Object.values(data).some(value => typeof value !== "string")
    ) {
      throw new Error("Geçersiz dosya");
    }

    fillForm(data);
    saveLocal();
    showStatus("Dosyadaki bilgiler forma yüklendi.");
  } catch (error) {
    showStatus("Dosya okunamadı. Lütfen geçerli EYTA JSON dosyası seçin.");
  }

  event.target.value = "";
});

// Temizlemeden önce onay iste.
document.getElementById("clearBtn").addEventListener("click", () => {
  if (!confirm("Formdaki tüm bilgileri temizlemek istiyor musunuz?")) {
    return;
  }

  form.reset();

  try {
    localStorage.removeItem(storageKey);
  } catch (error) {
    // Form yine de temizlenir.
  }

  showStatus("Form temizlendi.");
});
</script>

</body>
</html>
