
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EYTA ASANSÖR - Asansör Son Kontrol Formu</title>

<style>
:root {
  --blue: #173b63;
  --line: #d6dee8;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #eef2f7;
  color: #172334;
  font: 14px Arial, sans-serif;
}

main {
  max-width: 1000px;
  margin: 0 auto;
  padding: 24px;
  background: white;
  border-radius: 12px;
}

header {
  text-align: center;
  border-bottom: 2px solid var(--blue);
  padding-bottom: 14px;
}

header h1 {
  color: var(--blue);
  font-size: 28px;
  margin: 8px 0;
}

header h2 {
  color: #26384c;
  font-size: 19px;
  margin: 8px 0;
}

.section-title {
  background: #edf3f9;
  color: var(--blue);
  padding: 10px;
  font-size: 16px;
  margin-top: 24px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.field {
  min-width: 0;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 5px;
}

input, select {
  width: 100%;
  min-width: 0;
  padding: 10px;
  border: 1px solid #bcc9d8;
  border-radius: 5px;
  font: inherit;
  background: white;
}

@media (max-width: 600px) {
  body {
    padding: 0;
  }

  main {
    padding: 14px;
    border-radius: 0;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  header h1 {
    font-size: 23px;
  }
}
</style>
</head>

<body>
<main>

<header>
  <h1>EYTA ASANSÖR</h1>
  <h2>ASANSÖR SON KONTROL FORMU</h2>
</header>

<form>

  <div class="section-title">1. ASANSÖR SİSTEMİ</div>

  <div class="grid">
    <div class="field">
      <label>Asansör tahrik tipi</label>
      <select name="tahrik" required>
        <option value="">Seçiniz</option>
        <option value="Elektrikli">Elektrikli</option>
        <option value="Hidrolik">Hidrolik</option>
      </select>
    </div>
  </div>

  <div class="section-title">2. ŞANTİYE VE PROJE BİLGİLERİ</div>

  <div class="grid">

    <div class="field">
      <label>Şantiye adresi</label>
      <input type="text" name="adres">
    </div>

    <div class="field">
      <label>Asansör seri numarası</label>
      <input type="text" name="asansorNo">
    </div>

    <div class="field">
      <label>Montör ismi</label>
      <input type="text" name="montor">
    </div>

    <div class="field">
      <label>Uygulanan standart</label>
      <input type="text" name="standart"
             placeholder="Örn. EN 81-20">
    </div>

    <div class="field">
      <label>Yardımcı montör</label>
      <input type="text" name="yardimci">
    </div>

    <div class="field">
      <label>Bitiş tarihi</label>
      <input type="date" name="bitis">
    </div>

    <div class="field">
      <label>Başlangıç tarihi</label>
      <input type="date" name="baslangic">
    </div>

  </div>

</form>

</main>
</body>
</html>
